  <body>

    <!-- Performance optimization script -->
    <script>
      // Preload critical resources as soon as possible
      (function() {
        // Create link elements for critical resources
        const criticalResources = [
          { href: '/src/assets/images/landing-bg.webp', as: 'image', type: 'image/webp' },
          { href: '/src/assets/images/landing-bg.jpg', as: 'image', type: 'image/jpeg' }
        ];
        
        criticalResources.forEach(function(resource) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = resource.as;
          link.href = resource.href;
          if (resource.type) link.type = resource.type;
          if (resource.as === 'image') link.fetchPriority = 'high';
          document.head.appendChild(link);
        });
        
        // Optimize font loading
        if ('fonts' in document) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
